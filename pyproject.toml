[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ardy"
version = "0.2.0"
description = "ARDY inference runtime for Unitree G1 motion generation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  # Config / model wiring
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "pydantic>=2.0",
  # Core numerics
  "numpy>=2.4.0,<2.5",
  "scipy>=1.18",
  # Inference stack
  "torch>=2.7.0",
  "einops>=0.7",
  # Keep the upstream-tested 1.25 API while dependency compatibility is being
  # changed independently of the inference implementation.
  "vector-quantize-pytorch>=1.25,<1.26",
  # Checkpoint loading
  "safetensors>=0.4",
  # Misc
  "tqdm>=4.0",
  "packaging>=21.0",
]

[project.urls]
"Project Page" = "https://research.nvidia.com/labs/sil/projects/ardy/"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
ardy = ["assets/**/*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I001"]  # Enable import sorting

[tool.ruff.lint.isort]
known-first-party = ["ardy"]
known-third-party = ["torch", "numpy", "tqdm"]
force-sort-within-sections = false
